services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dynex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [dynex-pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  bot:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
  dashboard:
    build: .
    command: ["pnpm","start:dashboard"]
    env_file: .env
    depends_on: [postgres, redis]
volumes:
  dynex-pg:
